    API1834_successResponse:
      title: Get Event Summary Report Success Response Schema
      type: object
      additionalProperties: false
      required:
      - schemeDetails
      - eventReportDetails
      properties:
        schemeDetails:
          type: object
          required:
          - pSTR
          - schemeName
          additionalProperties: false
          properties:
            pSTR:
              type: string
              pattern: '[0-9]{8}[A-Z]{2}'
            schemeName:
              type: string
              minLength: 1
              maxLength: 160
        eventReportDetails:
          type: object
          required:
          - reportFormBundleNumber
          - reportStartDate
          - reportEndDate
          - reportStatus
          - reportVersionNumber
          - reportSubmittedDateAndTime
          additionalProperties: false
          properties:
            reportFormBundleNumber:
              type: string
              pattern: ^[0-9]{12}$
            reportStartDate:
              $ref: '#/components/schemas/API1834_dateType'
            reportEndDate:
              $ref: '#/components/schemas/API1834_dateType'
            reportStatus:
              description: Possible values are Compiled or Submitted
              type: string
              enum:
              - Compiled
              - Submitted
            reportVersionNumber:
              type: string
              pattern: '[0-9]{3}'
            reportSubmittedDateAndTime:
              type: string
              pattern: '[2-9][0-9]{3}-(01|02|03|04|05|06|07|08|09|10|11|12)-([0][1-9]|[1-2][0-9]|[3][0-1])T([0-1][0-9]|[2][0-3]):[0-5][0-9]:[0-5][0-9]Z'
        eventDetails:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            event10:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  recordVersion:
                    $ref: '#/components/schemas/API1834_versionType'
                  invRegScheme:
                    type: object
                    description: "Either startDateDetails or ceaseDateDetails provided"
                    properties:
                      startDateDetails:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          startDateOfInvReg:
                            $ref: '#/components/schemas/API1834_dateType'
                          contractsOrPolicies:
                            type: string
                            description: Possible values are Yes or No
                            enum:
                            - 'Yes'
                            - 'No'
                      ceaseDateDetails:
                        type: object
                        minProperties: 1
                        additionalProperties: false
                        properties:
                          ceaseDateOfInvReg:
                            $ref: '#/components/schemas/API1834_dateType'
                    additionalProperties: false
                required:
                  - recordVersion
            event11:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                recordVersion:
                  $ref: '#/components/schemas/API1834_versionType'
                unauthorisedPmtsDate:
                  allOf:
                  - $ref: '#/components/schemas/API1834_dateType'
                  - description: Date the scheme has changed its rules to entitle
                      any person to require the making of unauthorised payments
                contractsOrPoliciesDate:
                  allOf:
                  - $ref: '#/components/schemas/API1834_dateType'
                  - description: Date the scheme has changed its rules to allow investments
                      in assets other than contracts or policies of insurance
              required:
              - recordVersion
            event12:
              type: object
              additionalProperties: false
              properties:
                recordVersion:
                  $ref: '#/components/schemas/API1834_versionType'
                twoOrMoreSchemesDate:
                  allOf:
                  - $ref: '#/components/schemas/API1834_dateType'
                  - description: The scheme was treated as two or more schemes immediately
                      before 6 April 2006, and has changed its rules on
              required:
              - recordVersion
              - twoOrMoreSchemesDate
            event13:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  recordVersion:
                    $ref: '#/components/schemas/API1834_versionType'
                  schemeStructure:
                    type: string
                    enum:
                    - A single trust under which all of the assets are held for the
                      benefit of all members of the scheme
                    - A group life/death in service scheme
                    - A body corporate
                    - Other
                    description: 'Possible values: 01 - A single trust under which
                      all of the assets are held for the benefit of all members of
                      the scheme, 02 - A group life / death in service scheme, 03
                      - A body corporate 04 - Other'
                  schemeStructureOther:
                    type: string
                    pattern: ^[a-zA-Z0-9\s\\u00C0-\\u00FF!#$%&'‘’\\"“”«»()*+,.\/:;=?@\\\[\\\]£€¥\\u005C\\u2014\\u2013\\u2010\\u002d]{1,160}$
                    description: Free text to provide the scheme structure name if
                      04-other is selected for the pension scheme structure \u00C0
                      for À, \u00FF for ÿ, \u2014 for — (EM DASH), \u2013 for – (EN
                      DASH), \u2010 for -(HYPHEN), \u002d for -(HYPHEN_MINUS), \u005C
                      for \'
                  dateOfChange:
                    $ref: '#/components/schemas/API1834_dateType'
                required:
                - recordVersion
                - schemeStructure
                - dateOfChange
            event14:
              type: object
              additionalProperties: false
              properties:
                recordVersion:
                  $ref: '#/components/schemas/API1834_versionType'
                schemeMembers:
                  type: string
                  description: 'Possible values: 01 for 0, 02 for 1, 03 for 2 to 11,
                    04 for 12 to 50, 05 for 51 to 10000, 06 for More than 10000'
                  enum:
                  - '0'
                  - '1'
                  - 2 to 11
                  - 12 to 50
                  - 51 to 10,000
                  - More than 10,000
              required:
              - recordVersion
              - schemeMembers
            event18:
              type: object
              additionalProperties: false
              properties:
                recordVersion:
                  $ref: '#/components/schemas/API1834_versionType'
                chargeablePmt:
                  type: string
                  description: Has the scheme made a scheme chargeable payment - income
                    or gains from taxable property? Possible values are Yes or No
                  enum:
                  - 'Yes'
                  - 'false'
              required:
              - recordVersion
              - chargeablePmt
            event19:
              type: array
              items:
                type: object
                properties:
                  recordVersion:
                    $ref: '#/components/schemas/API1834_versionType'
                  countryCode:
                    type: string
                    pattern: ^[A-Z]{2}$
                  dateOfChange:
                    $ref: '#/components/schemas/API1834_dateType'
                additionalProperties: false
                required:
                - recordVersion
                - countryCode
                - dateOfChange
            event20:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  recordVersion:
                    $ref: '#/components/schemas/API1834_versionType'
                  occSchemeDetails:
                    type: object
                    description: "Either startDateOfOccScheme or stopDateOfOccScheme to be provided"
                    properties:
