openapi: 3.0.1
info:
  title: Pension Online Events
  version: 0.1.1
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0"
  description:  |
    This API specification describes the data structures and operations to support the Pension Online Events.
    
    The following resources are offered by this API:

    - **Create Compiled Event Summary Report**
    
      Allows to compile their event summary data in ETMP.
      
    - **Create Compiled Event 1 Report**
    
      Allows the PODS digital service to store compiled Event 1 report data for a pension scheme in ETMP before the formal declaration. 

    - **Submit Event Declaration Report**
    
      Allows the PODS digital service to submit the event declaration report for a pension scheme to ETMP, covering both PSA (Pension Scheme Administrator) and PSP (Pension Scheme Practitioner) declarations. 
      
    - **Submit Event 20A Declaration Report**
    
      Allows the PODS digital service to submit the Event 20A declaration report for a specific pension scheme. 

    - **Create Compiled Member Event Report**

      Stores a single-event-type member event report for a pension scheme.

    - **Get Event 20A Report**

      Allows pension scheme administrators  to retrieve the compiled Event 20A report data stored in ETMP. 

    - **Get Member Event Report**

      Allows Pension scheme administrators and practitioners  to review member-level event data that has been compiled in ETMP for their scheme before or after declaration. 

    - **Get Event 1 Report**  

      Allows Pension scheme administrators  to review their compiled Event 1 report data before or after declaration. 

    - **Get Event Summary Report**
    
      Provides a high-level view of all the event types and member event activity recorded for a pension scheme in a given reporting period.  

      
    **EPID Reference:**
    
    - EPID1822- HIP OAS: Pension Online Events

    ### Change Log
    | Version | Date | Author | Description |
    | :--- | :--- | :--- | :--- |
    | 0.1.0 | 2026-07-28 | GitHub Copilot | OAS Events OAS extracted from consolidated
    specification |
    | 0.1.1 | 2026-07-13 | Hima V Pramod |  Updated the main summary of the OAS and descriptions of individual APIs. |
    |||| Updated the description and regex for all the Headers.|
    |||| Included correlationid headers for 401,403 and 404 error codes.|
    |||| Defined the 400 Bad Request response in line aligning with HIP standards for all the APIs.|
    |||| Updated the success response status code to 201 for post operations.|
    |||| Updated the enums for the headers X-Originating-System and X- Transmitting-System.|
    |||| Included the EPID References.|
    |||| Included examples for header and path parameters.|
    |||| Updated 422 business validation error code descriptions and examples|
    
    
