      properties:
        eventReportDetails:
          type: object
          required:
          - reportStartDate
          - reportEndDate
          additionalProperties: false
          properties:
            reportStartDate:
              $ref: '#/components/schemas/API1827_dateType'
            reportEndDate:
              $ref: '#/components/schemas/API1827_dateType'
        event1Details:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            event1Details:
              type: array
              minItems: 1
              items:
                type: object
                properties:
                  amendedVersion:
                    $ref: '#/components/schemas/API1827_versionType'
                  memberStatus:
                    description: Possible values are New, Changed or Deleted
                    type: string
                    minLength: 1
                    maxLength: 12
                    enum:
                    - New
                    - Changed
                    - Deleted
                  memberType:
                    description: Possible values are Individual or Employer
                    type: string
                    minLength: 1
                    maxLength: 10
                    enum:
                    - Individual
                    - Employer
                  individualMemberDetails:
                    description: This node is mandatory if the Member Type is 01-Individual
                    type: object
                    required:
                    - firstName
                    - lastName
                    - nino
                    additionalProperties: false
                    properties:
                      title:
                        description: 'Possible values are 0001: Mr, 0002: Mrs, 0003:
                          Miss, 0004: Ms, 0005: Dr 0006: Sir, 0009: Professor, 0010:
                          Lord'
                        type: string
                        minLength: 1
                        maxLength: 10
                        enum:
                        - Mr
                        - Mrs
                        - Miss
                        - Ms
                        - Dr
                        - Sir
                        - Professor
                        - Lord
                      firstName:
                        $ref: '#/components/schemas/API1827_nameType'
                      middleName:
                        $ref: '#/components/schemas/API1827_nameType'
                      lastName:
                        $ref: '#/components/schemas/API1827_nameType'
                      nino:
                        type: string
                        minLength: 9
                        maxLength: 9
                        pattern: ^((?!(BG|GB|KN|NK|NT|TN|ZZ)|(D|F|I|Q|U|V)[A-Z]|[A-Z](D|F|I|O|Q|U|V))[A-Z]{2})[0-9]{6}[A-D]?$
                      signedMandate:
                        $ref: '#/components/schemas/API1827_yesNoType'
                      pmtMoreThan25PerFundValue:
                        $ref: '#/components/schemas/API1827_yesNoType'
                      schemePayingSurcharge:
                        $ref: '#/components/schemas/API1827_yesNoType'
                  employerMemDetails:
                    description: This node is mandatory if the Member Type is 02-Employer
                    type: object
                    required:
                    - compOrOrgName
                    - crnNumber
                    - addressDetails
                    additionalProperties: false
                    properties:
                      compOrOrgName:
                        type: string
                        minLength: 1
                        maxLength: 160
                        pattern: ^[a-zA-Z0-9\s\\u00C0-\\u00FF!#$%&'‘’\\"“”«»()*+,.\/:;=?@\\\[\\\]£€¥\\u005C\\u2014\\u2013\\u2010\\u002d]{1,160}$
                      crnNumber:
                        type: string
                        minLength: 7
                        maxLength: 8
                        pattern: ^[A-Za-z0-9 -]{1,8}$
                      addressDetails:
                        $ref: '#/components/schemas/API1827_addressDetailsType'
                  unAuthorisedPaymentDetails:
                    type: object
                    required:
                    - unAuthorisedPmtType1
                    - dateOfUnauthorisedPayment
                    - valueOfUnauthorisedPayment
                    additionalProperties: false
                    properties:
                      unAuthorisedPmtType1:
                        description: 'Possible Values are 100: Benefit in kind, 110:
                          Transfer to non-registered pensions scheme, 120: Error in
                          calculating tax free lump sums, 130: Benefits paid early
                          other than on the grounds of ill-health, protected pension
                          age or a winding up lump sum, 140: Refund of contributions,
                          150: Overpayment of pension/written off, 200: Loans to or
                          in respect of the employer exceeding 50% of the value of
                          the fund, 300: Residential property held directly or indirectly
                          by an investment-regulated pension scheme, 310: Tangible
                          moveable property held directly or indirectly by an investment-regulated
                          pension scheme, 320: Court Order Payment/Confiscation Order,
                          330: Other'
                        type: string
                        enum:
                        - Benefit in kind
                        - Transfer to non-registered pensions scheme
                        - Error in calculating tax free lump sums
                        - Benefits paid early other than on the grounds of ill-health,
                          protected pension age or a winding up lump sum
                        - Refund of contributions
                        - Overpayment of pension/written off
                        - Loans to or in respect of the employer exceeding 50% of
                          the value of the fund
                        - Residential property held directly or indirectly by an investment-regulated
                          pension scheme
                        - Tangible moveable property held directly or indirectly by
                          an investment-regulated pension scheme
                        - Court Order Payment/Confiscation Order
                        - Other
                      unAuthorisedPmtType2:
                        description: 'Possible Values are 110-1: Transfer to an Employer
                          Financed retirement Benefit scheme (EFRB), 110-2: Transfer
                          to a non-recognised pension scheme which is not a qualifying
                          overseas pension scheme, 140-1: Widow and/or orphan, 140-2:
                          Refund of contributions other, 150-1: Death of member, 150-2:
                          Death of dependent, 150-3: Dependent no longer qualified
                          for pension, 150-4: Overpayment of pension/written off other'
                        type: string
                        enum:
                        - Transfer to an Employer Financed retirement Benefit scheme
                          (EFRB)
                        - Transfer to a non-recognised pension scheme which is not
                          a qualifying overseas pension scheme
                        - Widow and/or orphan
                        - Refund of contributions other
                        - Death of member
                        - Death of dependent
                        - Dependent no longer qualified for pension
                        - Overpayment of pension/written off other
                      freeTxtOrSchemeOrRecipientName:
                        description: This field is applicable if Unauthorized Payment
                          Type 1 is one of the following; 100 - Benefit in kind -
                          Free text, 110 - Transfer to non-registered pensions scheme
                          (Provide Scheme Name), 120 - Error in calculating tax free
                          lump sums - Free text130 - Benefits paid early other than
                          on the grounds of ill-health, protected pension age or a
                          winding up lump sum - Free text,3 10 - Tangible moveable
                          property held directly or indirectly by an investment-regulated
                          pension scheme - Free Text, 320 - Court Order Payment/Confiscation
                          Order (Provide Name of Receipnt Name), 330 - Other - Free
                          Text
                        type: string
                        minLength: 1
                        maxLength: 160
                        pattern: ^[a-zA-Z0-9\s\\u00C0-\\u00FF!#$%&'‘’\\"“”«»()*+,.\/:;=?@\\\[\\\]£€¥\\u005C\\u2014\\u2013\\u2010\\u002d]{1,160}$
                      pstrOrReference:
                        description: This field is applicable if Unauthorized Payment
                          Type 1 is one of the following.110 - Transfer to non-registered
                          pensions scheme (Provide PSTR ID or Reference Number)
                        type: string
                        minLength: 1
                        maxLength: 160
                        pattern: ^[a-zA-Z0-9\s\\u00C0-\\u00FF!#$%&'‘’\\"“”«»()*+,.\/:;=?@\\\[\\\]£€¥\\u005C\\u2014\\u2013\\u2010\\u002d]{1,160}$
                      pmtAmtOrLoanAmt:
                        $ref: '#/components/schemas/API1827_monetaryValueType'
                      fundValue:
                        $ref: '#/components/schemas/API1827_monetaryValueType'
                      dateOfUnauthorisedPayment:
                        $ref: '#/components/schemas/API1827_dateType'
                      valueOfUnauthorisedPayment:
                        $ref: '#/components/schemas/API1827_monetaryValueType'
                      residentialPropertyAddress:
                        $ref: '#/components/schemas/API1827_addressDetailsType'
                required:
                 - memberStatus
                 - memberType
                 - unAuthorisedPaymentDetails
