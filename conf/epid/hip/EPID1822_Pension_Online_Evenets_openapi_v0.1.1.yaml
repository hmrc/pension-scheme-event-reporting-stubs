              additionalProperties: false
              properties:
                recordVersion:
                  $ref: '#/components/schemas/API1834_versionType'
                dateOfWindUp:
                  allOf:
                  - $ref: '#/components/schemas/API1834_dateType'
                  - description: MDTP will provide with value 31-12-9999 in case where
                      the previously submitted Wind-up date is deleted
              required:
              - recordVersion
              - dateOfWindUp
        memberEventsSummary:
          type: object
