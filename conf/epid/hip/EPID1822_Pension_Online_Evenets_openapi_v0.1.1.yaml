  /RESTAdapter/pension-online/event20a-status-reports/{pstr}:
    get:
      summary: API#1831 Get Event 20A Report
      description: "This API allows to retrieve the compiled Event 20A report data stored in ETMP.\n \nFor the successful scenario the API retrieves the Event 20A report for a given pension scheme (by PSTR).\n \nFor the unsuccessful scenario, the API will return error messages.\n \nEPID Reference:\n \nEPID1818"
      operationId: get_RESTAdapter_pension_online_event20a_status_reports_pstr_
      tags:
      - API#1831
      parameters:
      - $ref: '#/components/parameters/correlationid'
      - $ref: '#/components/parameters/X-Originating-System'
      - $ref: '#/components/parameters/X-Receipt-Date'
      - $ref: '#/components/parameters/X-Transmitting-System'
      - in: header
        name: reportFormBundleNumber
        description: Report Form Bundle Number - Used as an identifier in place of start date and version number
        required: false
        schema:
          type: string
          pattern: ^[0-9]{12}$
        example: 124456789012
      - in: header
        name: reportStartDate
        description: Report Start Date - Used as an identifier with version number in place of form bundle number
        required: false
        schema:
          type: string
          pattern: ^(((19|20)([2468][048]|[13579][26]|0[48])|2000)[-]02[-]29|((19|20)[0-9]{2}[-](0[469]|11)[-](0[1-9]|1[0-9]|2[0-9]|30)|(19|20)[0-9]{2}[-](0[13578]|1[02])[-](0[1-9]|[12][0-9]|3[01])|(19|20)[0-9]{2}[-]02[-](0[1-9]|1[0-9]|2[0-8])))$
        example: 2021-03-05
      - in: header
        name: reportVersionNumber
        description: Report Version Number - Used as an identifier with start date in place of form bundle number
        required: false
        schema:
          type: string
          pattern: '[0-9]{3}'
        example: "001"
      - $ref: '#/components/parameters/pstrParam'
      responses:
        '200':
          description: Successful Response
          headers:
            correlationid:
              $ref: '#/components/headers/correlationid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/API1831_get_RESTAdapter_pension_online_event20a_status_reports_pstr__SuccessResponse'
              example:
                success:
                  processingDate: 2026-07-23T20:46:18Z
                  schemeDetails:
                    pSTR: 87219363YN
                    schemeName: Abc Ltd
                  er20aDetails:
                    reportStartDate: 2021-04-06
                    reportEndDate: 2022-04-05
                    reportVersionNumber: '001'
                    reportSubmittedDateAndTime: 2023-12-13T12:12:12Z
                  schemeMasterTrustDetails:
                    startDate: 2021-06-08
                  erDeclarationDetails:
                    submittedBy: PSP
                    submittedID: '20000001'
                    submittedName: ABCDEFGHIJKLMNOPQRSTUV
                    pspDeclaration:
                      authorisedPSAID: A4045157
                      pspDeclaration1: Selected
                      pspDeclaration2: Selected
        '400':
          description: Bad Request Error
          headers:
            correlationid:
              $ref: '#/components/headers/correlationid'
