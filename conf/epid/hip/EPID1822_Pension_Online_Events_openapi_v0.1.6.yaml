                      startDateDetails:
                        minProperties: 1
                        type: object
                        properties:
                          contractsOrPolicies:
                            description: Possible values are  Yes or No
                            enum:
                            - "Yes"
                            - "No"
                            type: string
                          startDateOfInvReg:
                            $ref: "#/components/schemas/API1826_dateType"
                        additionalProperties: false
                    additionalProperties: false
                  recordVersion:
                    $ref: "#/components/schemas/API1826_versionType"
            event11:
              minProperties: 1
              type: object
              properties:
                contractsOrPoliciesDate:
                  allOf:
                  - description: Date the scheme has changed its rules to allow investments
                      in assets other than contracts or policies of insurance
                  - $ref: "#/components/schemas/API1826_dateType"
                recordVersion:
                  $ref: "#/components/schemas/API1826_versionType"
                unauthorisedPmtsDate:
                  allOf:
                  - description: Date the scheme has changed its rules to entitle
                      any person to require the making of unauthorised payments
                  - $ref: "#/components/schemas/API1826_dateType"
              additionalProperties: false
            event12:
              required:
              - twoOrMoreSchemesDate
              type: object
              properties:
                recordVersion:
                  $ref: "#/components/schemas/API1826_versionType"
                twoOrMoreSchemesDate:
                  allOf:
                  - description: "The scheme was treated as two or more schemes immediately\
                      \ before 6 April 2006, and has changed its rules on"
                  - $ref: "#/components/schemas/API1826_dateType"
              additionalProperties: false
            event13:
              minItems: 1
              type: array
              items:
                required:
                - dateOfChange
                - schemeStructure
                type: object
                properties:
                  dateOfChange:
                    $ref: "#/components/schemas/API1826_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1826_versionType"
                  schemeStructure:
                    description: "Possible Values: 01 - A single trust under which\
                      \ all of the assets are held for the benefit of all members\
                      \ of the scheme 02 - A group life / death in service scheme\
                      \ 03 - A body corporate 04 - Other"
                    enum:
                    - A single trust under which all of the assets are held for the
                      benefit of all members of the scheme
                    - A group life/death in service scheme
                    - A body corporate
                    - Other
                    type: string
                  schemeStructureOther:
                    description: "Free text to provide the scheme structure name if\
                      \ 04-other is selected for the pension scheme structure \\u00C0\
                      \ for À, \\u00FF for ÿ, \\u2014 for — (EM DASH), \\u2013 for\
                      \ – (EN DASH), \\u2010 for -(HYPHEN), \\u002d for -(HYPHEN_MINUS),\
                      \ \\u005C for \\"
                    pattern: "^[a-zA-Z0-9 À-ÿ!#$%&'‘’\"“”«»()*+,./:;=?@\\[\\]£€¥\\\
                      \\—–‐-]{1,160}$"
                    type: string
                additionalProperties: false
            event14:
              required:
              - schemeMembers
              type: object
              properties:
                recordVersion:
                  $ref: "#/components/schemas/API1826_versionType"
                schemeMembers:
                  description: "Possible Values:01 for 0,02 for 1,03 for 2 to 11,04\
                    \ for 12 to 50,05 for 51 to 10000,06 for More than 10000"
                  enum:
                  - "0"
                  - "1"
                  - 2 to 11
                  - 12 to 50
                  - "51 to 10,000"
                  - "More than 10,000"
                  type: string
              additionalProperties: false
            event18:
              required:
              - chargeablePmt
              type: object
              properties:
                chargeablePmt:
                  description: Has the scheme made a scheme chargeable payment - income
                    or gains from taxable property?Possible Value- Yes
                  enum:
                  - "Yes"
                  type: string
                recordVersion:
                  $ref: "#/components/schemas/API1826_versionType"
              additionalProperties: false
            event19:
              type: array
              items:
                required:
                - countryCode
                - dateOfChange
                type: object
                properties:
                  countryCode:
                    pattern: "^[A-Z]{2}$"
                    type: string
                  dateOfChange:
                    $ref: "#/components/schemas/API1826_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1826_versionType"
                additionalProperties: false
            event20:
              minItems: 1
              type: array
              items:
                type: object
                properties:
                  occSchemeDetails:
                    description: Either startDateOfOccScheme or stopDateOfOccScheme
                      to be provided
                    type: object
                    properties:
                      startDateOfOccScheme:
                        $ref: "#/components/schemas/API1826_dateType"
                      stopDateOfOccScheme:
                        $ref: "#/components/schemas/API1826_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1826_versionType"
                additionalProperties: false
