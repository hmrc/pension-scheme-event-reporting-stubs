                  pattern: "^[0-9]{4}-([0][1-9]|[1][0-2])-([0][1-9]|[1-2][0-9]|[3][0-1])$"
                  type: string
                recordVersion:
                  $ref: "#/components/schemas/API1826_versionType"
              additionalProperties: false
          additionalProperties: false
        eventReportDetails:
          required:
