  /RESTAdapter/pension-online/event-declaration-reports/{pstr}:
    post:
      description: "This API allows allows the PODS digital service to submit the\
        \ event declaration report for a pension scheme to ETMP, covering both PSA\
        \ (Pension Scheme Administrator) and PSP (Pension Scheme Practitioner) declarations.\
        \ \n \nFor the successful scenario the API returns a form bundle number and\
        \ processing date confirming the declaration has been received.\n \nFor the\
        \ unsuccessful scenario, the API will return error messages.\n \nEPID Reference:\n\
        \ \nEPID1815"
      operationId: post_RESTAdapter_pension_online_event_declaration_reports_pstr_
      parameters:
      - $ref: "#/components/parameters/correlationid"
      - $ref: "#/components/parameters/X-Originating-System"
      - $ref: "#/components/parameters/X-Receipt-Date"
      - $ref: "#/components/parameters/X-Transmitting-System"
      - $ref: "#/components/parameters/pstrParam"
      requestBody:
        content:
          application/json:
            example:
              declarationDetails:
                erDeclarationDetails:
                  submittedBy: PSA
                  submittedID: A2345678
                erDetails:
                  pSTR: 27176941JF
                  reportEndDate: 2021-04-05
                  reportStartDate: 2020-04-06
                psaDeclaration:
                  psaDeclaration1: Selected
                  psaDeclaration2: Selected
            schema:
              $ref: "#/components/schemas/API1828_request"
        description: Request body
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                success:
                  formBundleNumber: "12345678912"
                  processingDate: 2026-07-23T20:46:18Z
              schema:
                $ref: "#/components/schemas/API1828_post_RESTAdapter_pension_online_event_declaration_reports_pstr__SuccessResponse"
          description: Successful Response
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid"
        "400":
          content:
            application/json:
              examples:
                "400 Error Example":
                  value:
                    origin: HoD
                    response:
