          $ref: "#/components/schemas/API1834_amountType"
      additionalProperties: false
    API1834_get_RESTAdapter_pension_online_event_status_reports_pstr__SuccessResponse:
      required:
      - success
      type: object
      properties:
        success:
          $ref: "#/components/schemas/API1834_successResponse"
    API1834_memberEventType:
      description: Details for a member event
      required:
      - numberOfMembers
      - recordVersion
      type: object
      properties:
        numberOfMembers:
          $ref: "#/components/schemas/API1834_numberOfMembersType"
        recordVersion:
          $ref: "#/components/schemas/API1834_versionType"
      additionalProperties: false
    API1834_numberOfMembersType:
      maximum: 999999
      minimum: 0
      type: integer
    API1834_successResponse:
      title: Get Event Summary Report Success Response Schema
      required:
      - eventReportDetails
      - schemeDetails
      type: object
      properties:
        event1ChargeDetails:
          description: Provides a summary of charges related to Event 1
          minProperties: 1
          required:
          - numberOfMembers
          - recordVersion
          type: object
          properties:
            fcmtCharge:
              $ref: "#/components/schemas/API1834_event1ChargeType"
            numberOfMembers:
              $ref: "#/components/schemas/API1834_numberOfMembersType"
            recordVersion:
              $ref: "#/components/schemas/API1834_versionType"
            sscCharge:
              $ref: "#/components/schemas/API1834_event1ChargeType"
          additionalProperties: false
        eventDetails:
          minProperties: 1
          type: object
          properties:
            event10:
              minItems: 1
              type: array
              items:
                required:
                - recordVersion
                type: object
                properties:
                  invRegScheme:
                    description: Either startDateDetails or ceaseDateDetails provided
                    type: object
                    properties:
                      ceaseDateDetails:
                        minProperties: 1
                        type: object
                        properties:
                          ceaseDateOfInvReg:
                            $ref: "#/components/schemas/API1834_dateType"
                        additionalProperties: false
                      startDateDetails:
                        minProperties: 1
                        type: object
                        properties:
                          contractsOrPolicies:
                            description: Possible values are Yes or No
                            enum:
                            - "Yes"
                            - "No"
                            type: string
                          startDateOfInvReg:
                            $ref: "#/components/schemas/API1834_dateType"
                        additionalProperties: false
                    additionalProperties: false
                  recordVersion:
                    $ref: "#/components/schemas/API1834_versionType"
            event11:
              minProperties: 1
              required:
              - recordVersion
              type: object
              properties:
                contractsOrPoliciesDate:
                  allOf:
                  - description: Date the scheme has changed its rules to allow investments
                      in assets other than contracts or policies of insurance
                  - $ref: "#/components/schemas/API1834_dateType"
                recordVersion:
                  $ref: "#/components/schemas/API1834_versionType"
                unauthorisedPmtsDate:
                  allOf:
                  - description: Date the scheme has changed its rules to entitle
                      any person to require the making of unauthorised payments
                  - $ref: "#/components/schemas/API1834_dateType"
              additionalProperties: false
            event12:
              required:
              - recordVersion
              - twoOrMoreSchemesDate
              type: object
              properties:
                recordVersion:
                  $ref: "#/components/schemas/API1834_versionType"
                twoOrMoreSchemesDate:
                  allOf:
                  - description: "The scheme was treated as two or more schemes immediately\
                      \ before 6 April 2006, and has changed its rules on"
                  - $ref: "#/components/schemas/API1834_dateType"
              additionalProperties: false
            event13:
              minItems: 1
              type: array
              items:
                required:
                - dateOfChange
                - recordVersion
                - schemeStructure
                type: object
                properties:
                  dateOfChange:
                    $ref: "#/components/schemas/API1834_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1834_versionType"
                  schemeStructure:
                    description: "Possible values: 01 - A single trust under which\
                      \ all of the assets are held for the benefit of all members\
                      \ of the scheme, 02 - A group life / death in service scheme,\
                      \ 03 - A body corporate 04 - Other"
                    enum:
                    - A single trust under which all of the assets are held for the
                      benefit of all members of the scheme
                    - A group life/death in service scheme
                    - A body corporate
                    - Other
                    type: string
                  schemeStructureOther:
                    description: "Free text to provide the scheme structure name if\
                      \ 04-other is selected for the pension scheme structure \\u00C0\
                      \ for À, \\u00FF for ÿ, \\u2014 for — (EM DASH), \\u2013 for\
                      \ – (EN DASH), \\u2010 for -(HYPHEN), \\u002d for -(HYPHEN_MINUS),\
                      \ \\u005C for \\'"
                    pattern: "^[a-zA-Z0-9 À-ÿ!#$%&'‘’\"“”«»()*+,./:;=?@\\[\\]£€¥\\\
                      \\—–‐-]{1,160}$"
                    type: string
                additionalProperties: false
            event14:
              required:
              - recordVersion
              - schemeMembers
              type: object
              properties:
                recordVersion:
                  $ref: "#/components/schemas/API1834_versionType"
                schemeMembers:
                  description: "Possible values: 01 for 0, 02 for 1, 03 for 2 to 11,\
                    \ 04 for 12 to 50, 05 for 51 to 10000, 06 for More than 10000"
                  enum:
                  - "0"
                  - "1"
                  - 2 to 11
                  - 12 to 50
                  - "51 to 10,000"
                  - "More than 10,000"
                  type: string
              additionalProperties: false
            event18:
              required:
              - chargeablePmt
              - recordVersion
              type: object
              properties:
                chargeablePmt:
                  description: Has the scheme made a scheme chargeable payment - income
                    or gains from taxable property? Possible values are Yes or No
                  enum:
                  - "Yes"
                  - "false"
                  type: string
                recordVersion:
                  $ref: "#/components/schemas/API1834_versionType"
              additionalProperties: false
            event19:
              type: array
              items:
                required:
                - countryCode
                - dateOfChange
                - recordVersion
                type: object
                properties:
                  countryCode:
                    pattern: "^[A-Z]{2}$"
                    type: string
                  dateOfChange:
                    $ref: "#/components/schemas/API1834_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1834_versionType"
                additionalProperties: false
            event20:
              minItems: 1
              type: array
              items:
                required:
                - recordVersion
                type: object
                properties:
                  occSchemeDetails:
                    description: Either startDateOfOccScheme or stopDateOfOccScheme
                      to be provided
                    type: object
                    properties:
                      startDateOfOccScheme:
                        $ref: "#/components/schemas/API1834_dateType"
                      stopDateOfOccScheme:
                        $ref: "#/components/schemas/API1834_dateType"
                  recordVersion:
                    $ref: "#/components/schemas/API1834_versionType"
            eventWindUp:
              required:
              - dateOfWindUp
              - recordVersion
              type: object
              properties:
                dateOfWindUp:
                  allOf:
                  - description: MDTP will provide with value 31-12-9999 in case where
                      the previously submitted Wind-up date is deleted
                  - $ref: "#/components/schemas/API1834_dateType"
                recordVersion:
                  $ref: "#/components/schemas/API1834_versionType"
              additionalProperties: false
          additionalProperties: false
        eventReportDetails:
          required:
          - reportEndDate
          - reportFormBundleNumber
          - reportStartDate
          - reportStatus
          - reportSubmittedDateAndTime
          - reportVersionNumber
          type: object
          properties:
            reportEndDate:
              $ref: "#/components/schemas/API1834_dateType"
            reportFormBundleNumber:
              pattern: "^[0-9]{12}$"
              type: string
            reportStartDate:
              $ref: "#/components/schemas/API1834_dateType"
            reportStatus:
              description: Possible values are Compiled or Submitted
              enum:
              - Compiled
              - Submitted
              type: string
            reportSubmittedDateAndTime:
              pattern: "[2-9][0-9]{3}-(01|02|03|04|05|06|07|08|09|10|11|12)-([0][1-9]|[1-2][0-9]|[3][0-1])T([0-1][0-9]|[2][0-3]):[0-5][0-9]:[0-5][0-9]Z"
              type: string
            reportVersionNumber:
              pattern: "[0-9]{3}"
              type: string
          additionalProperties: false
        memberEventsSummary:
          description: Provides a summary of the member events. If no events have
            occured this section will not be present in the response.
          minProperties: 1
          type: object
          properties:
            event2:
              $ref: "#/components/schemas/API1834_memberEventType"
            event3:
              $ref: "#/components/schemas/API1834_memberEventType"
            event4:
              $ref: "#/components/schemas/API1834_memberEventType"
            event5:
              $ref: "#/components/schemas/API1834_memberEventType"
            event6:
              $ref: "#/components/schemas/API1834_memberEventType"
            event7:
              $ref: "#/components/schemas/API1834_memberEventType"
            event8:
              $ref: "#/components/schemas/API1834_memberEventType"
            event8A:
              $ref: "#/components/schemas/API1834_memberEventType"
            event22:
              $ref: "#/components/schemas/API1834_memberEventType"
            event23:
              $ref: "#/components/schemas/API1834_memberEventType"
            event24:
              $ref: "#/components/schemas/API1834_memberEventType"
          additionalProperties: false
        schemeDetails:
          required:
          - pSTR
          - schemeName
          type: object
          properties:
            pSTR:
              pattern: "[0-9]{8}[A-Z]{2}"
              type: string
            schemeName:
              maxLength: 160
              minLength: 1
              type: string
          additionalProperties: false
      additionalProperties: false
    API1834_versionType:
      description: Version number from 001 to 999
      pattern: "^[0-9]{3}$"
      type: string
    SystemErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          required:
          - code
          - logID
          - message
          type: object
          properties:
            code:
              enum:
              - "400"
              - "500"
              type: string
            logID:
              description: Constraint details are sourced from backend artefacts.
              type: string
            message:
              description: Constraint details are sourced from backend artefacts.
              type: string
    HIP-originEnum:
      enum:
      - HIP
      - HoD
      type: string
    HIP-failureResponse:
      required:
      - failures
      type: object
      properties:
        failures:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            required:
            - type
            - reason
            type: object
            properties:
              type:
                type: string
              reason:
                type: string
            additionalProperties: false
    HIP-originResponse:
      required:
      - origin
      type: object
      properties:
        origin:
          $ref: "#/components/schemas/HIP-originEnum"
        response:
          $ref: "#/components/schemas/HIP-failureResponse"
      additionalProperties: false
