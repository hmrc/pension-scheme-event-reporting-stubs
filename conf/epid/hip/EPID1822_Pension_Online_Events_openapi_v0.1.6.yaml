openapi: 3.0.3
info:
  description: "This API specification describes the data structures and operations\
    \ to support the Pension Online Events.\n\nThe following resources are offered\
    \ by this API:\n\n- **Create Compiled Event Summary Report**\n\n  Allows to compile\
    \ their event summary data in ETMP.\n  \n- **Create Compiled Event 1 Report**\n\
    \n  Allows the PODS digital service to store compiled Event 1 report data for\
    \ a pension scheme in ETMP before the formal declaration. \n\n- **Submit Event\
    \ Declaration Report**\n\n  Allows the PODS digital service to submit the event\
    \ declaration report for a pension scheme to ETMP, covering both PSA (Pension\
    \ Scheme Administrator) and PSP (Pension Scheme Practitioner) declarations. \n\
    \  \n- **Submit Event 20A Declaration Report**\n\n  Allows the PODS digital service\
    \ to submit the Event 20A declaration report for a specific pension scheme. \n\
    \n- **Create Compiled Member Event Report**\n\n  Stores a single-event-type member\
    \ event report for a pension scheme.\n\n- **Get Event 20A Report**\n\n  Allows\
    \ pension scheme administrators  to retrieve the compiled Event 20A report data\
    \ stored in ETMP. \n\n- **Get Member Event Report**\n\n  Allows Pension scheme\
    \ administrators and practitioners  to review member-level event data that has\
    \ been compiled in ETMP for their scheme before or after declaration. \n\n- **Get\
    \ Event 1 Report**  \n\n  Allows Pension scheme administrators  to review their\
    \ compiled Event 1 report data before or after declaration. \n\n- **Get Event\
    \ Summary Report**\n\n  Provides a high-level view of all the event types and\
    \ member event activity recorded for a pension scheme in a given reporting period.\
    \  \n\n- **Get Report Versions**\n\n  Allows to see a list of report versions\
    \ that have been submitted for a specific pension scheme within a given period.\n\
    \n- **Get Reporting Overview**\n\n  Allows to know how many versions of a pension\
    \ scheme report exist for a given Pension Scheme Tax Reference (PSTR), report\
    \ type (AFT, PSR, ER, or ER20A) and date range. \n\n  \n**EPID Reference:**\n\n\
    - EPID1822- HIP OAS: Pension Online Events\n\n### Change Log\n| Version | Date\
    \ | Author | Description |\n| :--- | :--- | :--- | :--- |\n| 0.1.0 | 2026-07-28\
    \ | GitHub Copilot | OAS Events OAS extracted from consolidated specification\
    \ |\n| 0.1.1 | 2026-07-13 | Hima V Pramod |  Updated the main summary of the OAS\
    \ and descriptions of individual APIs. |\n|||| Updated the description and regex\
    \ for all the Headers.|\n|||| Included correlationid headers for 401,403 and 404\
    \ error codes.|\n|||| Defined the 400 Bad Request response in line aligning with\
    \ HIP standards for all the APIs.|\n|||| Updated the success response status code\
    \ to 201 for post operations.|\n|||| Updated the enums for the headers X-Originating-System\
    \ and X- Transmitting-System.|\n|||| Included the EPID References.|\n|||| Included\
    \ examples for header and path parameters.|\n|||| Updated 422 business validation\
    \ error code descriptions and examples|\n|0.1.2|2026-09-02|Hima V Pramod|Updated\
    \ the Event24 *paymentDetails* schema as per review comments|\n|0.1.3|2026-09-18|Hima\
    \ V Pramod| Updated the Event24 *paymentDetails* schema for API1830 and API1832\
    \ as per  review comments.|\n||||Removed the oneOf nesting for *taxedAtMarginalRate*\
    \ and *payeReference* for API1830 and API1832 as this was causing validation issues\
    \ due to ambiguity in structure.Now these fields are made optional with descriptions\
    \ indicating when these fields should be mandatory.This would not cause any change\
    \ in the payload structure.|\n||||Updated error texts for code 004 and 125 for\
    \ API1829|\n||||Corrected a spelling error in the error message for code 166 in\
    \ API1827|\n|0.1.4|2026-09-23|Hima V Pramod|Included two more endpoints API1537-Get\
    \ Report Versions and API1557-Get Reporting Overview|\n||||Updated domain and\
    \ sub-domain.\n|0.1.5|2026-10-01|Hima V Pramod| Updated error text for 004 in\
    \ API1830|\n||||Updated error text for 058 in API1828|\n||||Updated error text\
    \ for 091 in API1829|\n||||Updated error text for 004 in API1826|\n||||Updated\
    \ error text for 004 in API1827|\n||||Updated the regex for field schemeStructureOther\
    \ in API1826|\n|||| Updated the regex for fields compOrOrgName,freeTxtOrSchemeOrRecipientName\
    \ and pstrOrReference in APIs 1827 and 1833|\n||||Updated the regex for definitions\
    \ API1830_freeTextType and API1832_freeTextType|\n|||| Enclosed enums in quotes\
    \ for fields submittedVersionAvailable and compiledVersionAvailable in API1557\
    \ as per review comments|\n||||Updated the pattern for organisationOrPartnershipName\
    \ to include spaces in API1537 as per review comments|\n||||Updated error text\
    \ for 085 and 168 in API1832|\n||||Updated error text for 085 and included error\
    \ code 168 for API1831|\n||||Updated error text for 004 in API1834|\n|0.1.6|2026-10-16|Hima\
    \ V Pramod|Updated error text for 168 in API1833|\n|||| Updated the regex for\
    \ fields compOrOrgName,freeTxtOrSchemeOrRecipientName and pstrOrReference in APIs\
    \ 1827 and 1833 as per the suggestion from EIS team on the validation error in\
    \ HIP.|\n||||Updated the regex for definitions API1830_freeTextType and API1832_freeTextType\
    \ as per the suggestion from EIS team on the validation error in HIP.|\n"
