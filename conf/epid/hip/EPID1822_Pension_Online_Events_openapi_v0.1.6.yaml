  /RESTAdapter/pension-online/event1-reports/{pstr}:
    post:
      description: "This API allows the PODS digital service to store compiled Event\
        \ 1 report data for a pension scheme in ETMP before the formal declaration.\
        \ \n \nFor the successful scenario the compiled data may be created, amended,\
        \ or resubmitted; ETMP maintains a version number per report entry.\n \nFor\
        \ the unsuccessful scenario, the API will return error messages.\n \nEPID\
        \ Reference:\n \nEPID1814"
      operationId: post_RESTAdapter_pension_online_event1_reports_regime_pstr_
      parameters:
      - $ref: "#/components/parameters/correlationid"
      - $ref: "#/components/parameters/X-Originating-System"
      - $ref: "#/components/parameters/X-Receipt-Date"
      - $ref: "#/components/parameters/X-Transmitting-System"
      - $ref: "#/components/parameters/pstrParam"
      requestBody:
        content:
          application/json:
            example:
              event1Details:
                event1Details:
                - individualMemberDetails:
                    firstName: John
                    lastName: Smith
                    middleName: Mac
                    nino: AA999999A
                    pmtMoreThan25PerFundValue: "No"
                    schemePayingSurcharge: "Yes"
                    signedMandate: "Yes"
                    title: Mr
                  memberStatus: New
                  memberType: Individual
                  unAuthorisedPaymentDetails:
                    dateOfUnauthorisedPayment: 2020-06-30
                    freeTxtOrSchemeOrRecipientName: ABCDEFGHIJKLMNOPQRSTUV
