  /RESTAdapter/pension-online/event-status-reports/{pstr}:
    get:
      description: "This API provides a high-level view of all the event types and\
        \ member event activity recorded for a pension scheme in a given reporting\
        \ period. Administrators use this report to confirm which events have been\
        \ compiled, their counts and charge amounts, and the overall status of the\
        \ event report before or after declaration. \n \nFor the successful scenario\
        \ the API retrieves the event summary report from ETMP for a pension scheme\
        \ identified by PSTR. \n \nFor the unsuccessful scenario, the API will return\
        \ error messages.\n \nEPID Reference:\n \nEPID1821"
      operationId: get_RESTAdapter_pension_online_event_status_reports_pstr_
      parameters:
      - $ref: "#/components/parameters/correlationid"
      - $ref: "#/components/parameters/X-Originating-System"
      - $ref: "#/components/parameters/X-Receipt-Date"
      - $ref: "#/components/parameters/X-Transmitting-System"
      - description: Report Form Bundle Number - Used as an identifier in place of
          start date and version number
        example: 124456789012
        explode: false
        in: header
        name: reportFormBundleNumber
        required: false
        schema:
          pattern: "^[0-9]{12}$"
          type: string
        style: simple
      - description: Report Start Date - Used as an identifier with version number
          in place of form bundle number
        example: 2021-03-05
        explode: false
        in: header
        name: reportStartDate
        required: false
        schema:
          pattern: "^(((19|20)([2468][048]|[13579][26]|0[48])|2000)[-]02[-]29|((19|20)[0-9]{2}[-](0[469]|11)[-](0[1-9]|1[0-9]|2[0-9]|30)|(19|20)[0-9]{2}[-](0[13578]|1[02])[-](0[1-9]|[12][0-9]|3[01])|(19|20)[0-9]{2}[-]02[-](0[1-9]|1[0-9]|2[0-8])))$"
          type: string
        style: simple
      - description: Report Version Number - Used as an identifier with start date
          in place of form bundle number
        example: "001"
        explode: false
        in: header
        name: reportVersionNumber
        required: false
        schema:
          pattern: "[0-9]{3}"
          type: string
        style: simple
