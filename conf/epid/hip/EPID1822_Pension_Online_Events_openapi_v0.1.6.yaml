        \ submitted for a specific pension scheme within a given period. \n \nThe\
        \ call is synchronous.\n\n For the successful scenario the API looks up the\
        \ records held in HMRC's central ETMP system and returns a list of each version\
        \ found, including its status (for example, compiled or submitted), the date\
        \ it was compiled or submitted, and details of who submitted it. If no records\
        \ match, a clear not found message is returned.  \n \nFor the unsuccessful\
        \ scenario, the API will return error messages.\n \nEPID Reference:\n \nEPID1872"
